name: Complete K3 dashboard integration
on:
  push:
    branches: [fix/grade-dashboards-navigation-and-mobile-hero]
    paths: ['scripts/complete_v7130_k3.py','.github/workflows/complete-v7130-k3.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply complete K3 dashboard
        run: python3 scripts/complete_v7130_k3.py
      - name: Verify code and navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess
          s=Path('courses/little-learners.html').read_text()
          for token in ('ila-v7130-final-dashboard','ila-grade-score','Back to Academy','--ila-k3-scene','izzy-academy-v1'):
              assert token in s,token
          for i,match in enumerate(re.finditer(r'<script\b([^>]*)>(.*?)</script>',s,re.S|re.I)):
              attrs,body=match.groups()
              if not body.strip() or re.search(r'type=[\"\x27]application/(?:json|ld\+json)',attrs,re.I):continue
              p=Path('/tmp/check-'+str(i)+'.js');p.write_text(body)
              result=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
              if result.returncode:raise Exception('JS '+str(i)+' '+result.stderr)
          PY
      - name: Commit dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add courses/little-learners.html
          git diff --cached --quiet || (git commit -m "Complete K3 grade dashboard and shared Academy rewards" && git push)
