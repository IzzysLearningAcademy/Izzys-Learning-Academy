name: Add Blank Sketch Paper
on:
  push:
    branches: [fix/grade-dashboards-navigation-and-mobile-hero]
    paths: ['scripts/add_blank_sketch_paper.py','.github/workflows/add-blank-paper.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Blank Paper without modifying eraser
        run: python3 scripts/add_blank_sketch_paper.py
      - name: Verify all three paper types
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('academy.html').read_text()
          for x in ('royalLines','royalGraph','royalBlank','.izsp-paper.blank'):
              assert x in s,x
          assert "function setEraser(on)" in s
          PY
      - name: Commit Sketch Paper change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add academy.html
          git diff --cached --quiet || (git commit -m "Add blank sheet to Sketch Paper" && git push)
