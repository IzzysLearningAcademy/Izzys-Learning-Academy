name: Validate K3 single navigation
on:
  pull_request:
    paths: ['courses/little-learners.html', '.github/workflows/validate-k3-single-nav.yml']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check dashboard structure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('courses/little-learners.html').read_text()
          assert s.count('id="ila-grade-home"')==1, 'Duplicate Home navigation'
          assert s.count('id="ila-v7130-final-dashboard"')==1
          assert 'id="ila-k3-grade-nav-v7130"' not in s
          assert 'id="ila-k3-scene-viewer"' not in s
          assert 'id="ila-v7131-k3-layout-correction"' in s
          assert 'aspect-ratio:2400 / 633!important' in s
          assert 'id="ila-grade-score"' in s
          assert 'ila-k3-grade-ready' in s
          for name in ('k','g1','g2','g3'):
              assert Path(f'assets/k3/{name}-banner.webp').is_file(),name
          print('PASS: one nav, grade scenes present, aspect ratio, stars and level placeholder')
          PY
