name: Apply K3 dashboard repair
on:
  push:
    branches:
      - fix/k3-full-scenes-and-subject-navigation
    paths:
      - '.github/workflows/apply-k3-dashboard.yml'
      - 'scripts/apply_k3_dashboard_fix.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reproducible dashboard patch
        run: python3 scripts/apply_k3_dashboard_fix.py
      - name: Check JavaScript syntax
        run: |
          python3 - <<'PY'
          import re, subprocess, pathlib
          s=pathlib.Path('courses/little-learners.html').read_text()
          for i,m in enumerate(re.finditer(r'<script\b[^>]*>(.*?)</script>',s,re.S|re.I)):
              if 'src=' in m.group(0).split('>')[0] or 'type="application/json"' in m.group(0).split('>')[0]: continue
              p=pathlib.Path('/tmp/ila-script.js')
              p.write_text(m.group(1))
              r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
              if r.returncode:
                  raise SystemExit(f'Inline JS block {i}: {r.stderr}')
          PY
      - name: Commit tested K3 page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add courses/little-learners.html
          git diff --cached --quiet || (git commit -m "Fix K3 full illustrated scenes and on-demand coursework" && git push)
